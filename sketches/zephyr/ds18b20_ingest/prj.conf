# ThermalTrace DS18B20 → HTTP ingest (Zephyr / STM32 Nucleo-F767ZI)
# Onboard Ethernet. Not Arduino IDE, not Python.
# https://thermaltrace.dev/about/stm32-zephyr-ingest

CONFIG_GPIO=y
CONFIG_W1=y
CONFIG_W1_GPIO=y
CONFIG_SENSOR=y
CONFIG_DS18B20=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=n

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_POSIX_API=y
