; ThermalTrace DS18B20 → HTTPS ingest (ESP32 Arduino core)
; https://thermaltrace.dev/about/esp32-web-flash
;
; After creating a push device, prefer Dashboard → Devices → Download Arduino .ino
; (INGEST_URL pre-filled), or set build_flags below.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
build_flags =
  -DWIFI_SSID=\"your-wifi\"
  -DWIFI_PASS=\"your-password\"
  ; Uncomment and paste your Devices ingest URL:
  ; -DINGEST_URL=\"https://thermaltrace.dev/api/ingest/YOUR_DEVICE_KEY\"

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
build_flags =
  -DWIFI_SSID=\"your-wifi\"
  -DWIFI_PASS=\"your-password\"
