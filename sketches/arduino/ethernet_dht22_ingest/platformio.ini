; Arduino Uno + W5100 Ethernet shield → ThermalTrace (HTTP push + optional pull)
; https://thermaltrace.dev/about/arduino-sketches
;
; W5100 cannot TLS. Run sketches/relay/push_https_forward.py on a LAN host
; and point INGEST_HOST at that machine.

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
  ; LAN HTTP→HTTPS relay (see sketches/relay/push_https_forward.py)
  ; -DINGEST_HOST=\"192.168.1.50\"
  ; -DINGEST_PORT=8080
  ; -DINGEST_PATH=\"/api/ingest/YOUR_DEVICE_KEY\"
