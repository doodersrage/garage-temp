; WiFiManager + DS18B20 → ThermalTrace ingest
; Library: tzapu/WiFiManager (captive portal for SSID/password)

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  ; -DINGEST_URL=\"https://thermaltrace.dev/api/ingest/YOUR_DEVICE_KEY\"
