# Home Assistant entity naming for ThermalTrace push devices
# Copy sensor keys from Dashboard → Temperature → device sensors.

sensor:
  - platform: rest
    name: garage_temp_living
    resource: http://YOUR_DEVICE_IP/status
    # Or use MQTT / webhook ingest to ThermalTrace instead

# Recommended entity_id pattern when mirroring ingest keys:
#   sensor.garage_<space>_<key>_temperature
#   binary_sensor.garage_<space>_<key>_door
#   sensor.garage_<space>_<key>_battery

template:
  - sensor:
      - name: "ThermalTrace Delta Outdoor"
        unit_of_measurement: "°F"
        device_class: temperature
        state: >
          {{ states('sensor.garage_garage_avg_temperature') | float(0) -
             states('weather.home') | float(0) }}

binary_sensor:
  - name: "Garage Door Open Extended"
    device_class: door
    state: >
      {{ is_state('binary_sensor.garage_door_door', 'on') }}

automation:
  - alias: "ThermalTrace freeze snooze via inbound webhook"
    trigger:
      - platform: numeric_state
        entity_id: sensor.garage_garage_avg_temperature
        below: 34
    action:
      - service: rest_command.garage_temp_inbound_snooze

rest_command:
  garage_temp_inbound_snooze:
    url: "https://YOUR_SITE/api/inbound/YOUR_TOKEN"
    method: POST
    content_type: "application/json"
    payload: '{"action":"snooze","hours":24}'
