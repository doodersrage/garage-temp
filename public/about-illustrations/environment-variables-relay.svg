<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-environment-variables-relay desc-environment-variables-relay">
  <title id="title-environment-variables-relay">Relay environment variables</title>
  <desc id="desc-environment-variables-relay">Env file configures relay at startup</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="80" y="80" width="200" height="200" rx="6" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <text x="100" y="110" fill="#381d2a" font-size="11" font-family="monospace">UPSTREAM_URL=</text>
  <text x="100" y="140" fill="#381d2a" font-size="11" font-family="monospace">REDIS_URL=</text>
  <text x="100" y="170" fill="#381d2a" font-size="11" font-family="monospace">CACHE_TTL=</text>
  <path d="M280 180 H360" stroke="#ba5624" stroke-width="3" marker-end="url(#arr3)"/>
  <rect x="360" y="130" width="200" height="100" rx="8" fill="#c4d6b0"/>
  <text x="460" y="185" text-anchor="middle" fill="#381d2a" font-size="13" font-family="system-ui">Relay process</text>
  <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ba5624"/></marker></defs>
</svg>