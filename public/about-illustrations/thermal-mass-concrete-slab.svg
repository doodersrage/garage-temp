<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-thermal-mass-concrete-slab desc-thermal-mass-concrete-slab">
  <title id="title-thermal-mass-concrete-slab">Thermal mass slab</title>
  <desc id="desc-thermal-mass-concrete-slab">Slab stores heat and lags air temperature</desc>
  <defs>
    <linearGradient id="bg-thermalxmassxconcretexslab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-thermalxmassxconcretexslab" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-thermalxmassxconcretexslab" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-thermalxmassxconcretexslab" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-thermalxmassxconcretexslab" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-thermalxmassxconcretexslab)"/>
  <rect width="640" height="360" fill="url(#glow-thermalxmassxconcretexslab)"/>
  <rect width="640" height="360" fill="url(#glow2-thermalxmassxconcretexslab)"/>
  <rect width="640" height="360" fill="url(#dots-thermalxmassxconcretexslab)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">THERMAL MASS SLAB</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-thermalxmassxconcretexslab)" transform="translate(0, 8)"><rect x="0" y="260" width="640" height="100" fill="#1a2230"/>
  <text x="320" y="310" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="system-ui">Concrete thermal mass</text>
  <path d="M80 220 L560 220" stroke="#3b82f6" stroke-width="2"/>
  <path d="M80 180 Q200 200 320 150 T560 120" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <text x="90" y="175" fill="#94a3b8" font-size="12" font-family="system-ui">Air temp (fast)</text>
  <path d="M80 240 Q200 235 320 230 T560 225" stroke="rgba(59,130,246,0.28)" stroke-width="3" fill="none"/>
  <text x="90" y="250" fill="#94a3b8" font-size="12" font-family="system-ui">Slab influence (slow)</text></g>
</svg>