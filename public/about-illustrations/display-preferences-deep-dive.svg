<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-display-preferences-deep-dive desc-display-preferences-deep-dive">
  <title id="title-display-preferences-deep-dive">Display preferences</title>
  <desc id="desc-display-preferences-deep-dive">Settings toggles for units and card order</desc>
  <defs>
    <linearGradient id="bg-displayxpreferencesxdeepxdive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-displayxpreferencesxdeepxdive" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-displayxpreferencesxdeepxdive" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-displayxpreferencesxdeepxdive" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-displayxpreferencesxdeepxdive" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-displayxpreferencesxdeepxdive)"/>
  <rect width="640" height="360" fill="url(#glow-displayxpreferencesxdeepxdive)"/>
  <rect width="640" height="360" fill="url(#glow2-displayxpreferencesxdeepxdive)"/>
  <rect width="640" height="360" fill="url(#dots-displayxpreferencesxdeepxdive)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">DISPLAY PREFERENCES</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-displayxpreferencesxdeepxdive)" transform="translate(0, 8)"><rect x="140" y="60" width="360" height="240" rx="8" fill="#151b24" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui">Display preferences</text>
  <rect x="180" y="120" width="60" height="30" rx="15" fill="#3b82f6"/>
  <rect x="250" y="125" width="30" height="20" rx="10" fill="#f8fafc"/>
  <text x="320" y="140" fill="#94a3b8" font-size="11" font-family="system-ui">°F / °C</text>
  <rect x="180" y="180" width="280" height="40" rx="4" fill="rgba(59,130,246,0.28)" opacity="0.5"/>
  <text x="200" y="205" fill="#94a3b8" font-size="11" font-family="system-ui">Feed order ⋮⋮</text>
  <rect x="180" y="240" width="280" height="40" rx="4" fill="#60a5fa" opacity="0.4"/>
  <text x="200" y="265" fill="#94a3b8" font-size="11" font-family="system-ui">Show humidity</text></g>
</svg>