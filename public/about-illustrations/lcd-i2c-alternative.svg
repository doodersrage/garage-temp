<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-lcd-i2c-alternative desc-lcd-i2c-alternative">
  <title id="title-lcd-i2c-alternative">I2C LCD alternative</title>
  <desc id="desc-lcd-i2c-alternative">Parallel vs I2C pin count</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="60" y="100" width="220" height="160" rx="6" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" fill="#381d2a" font-size="12" font-family="system-ui">Parallel: 6+ pins</text>
  <rect x="90" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="118" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="146" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="174" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="202" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="230" y="160" width="16" height="40" fill="#ba5624"/>
  <rect x="360" y="100" width="220" height="160" rx="6" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <text x="470" y="130" text-anchor="middle" fill="#381d2a" font-size="12" font-family="system-ui">I²C: 2 wires</text>
  <line x1="400" y1="200" x2="540" y2="200" stroke="#c4d6b0" stroke-width="4"/>
  <line x1="400" y1="230" x2="540" y2="230" stroke="#c4d6b0" stroke-width="4"/>
  <text x="470" y="260" text-anchor="middle" fill="#381d2a" font-size="11" font-family="system-ui">SDA / SCL</text>
</svg>