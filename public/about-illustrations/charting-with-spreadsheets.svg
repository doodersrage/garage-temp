<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-charting-with-spreadsheets desc-charting-with-spreadsheets">
  <title id="title-charting-with-spreadsheets">Spreadsheet charting</title>
  <desc id="desc-charting-with-spreadsheets">CSV columns drive a line chart</desc>
  <defs>
    <linearGradient id="bg-chartingxwithxspreadsheets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-chartingxwithxspreadsheets" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-chartingxwithxspreadsheets" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-chartingxwithxspreadsheets" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-chartingxwithxspreadsheets" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-chartingxwithxspreadsheets)"/>
  <rect width="640" height="360" fill="url(#glow-chartingxwithxspreadsheets)"/>
  <rect width="640" height="360" fill="url(#glow2-chartingxwithxspreadsheets)"/>
  <rect width="640" height="360" fill="url(#dots-chartingxwithxspreadsheets)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">SPREADSHEET CHARTING</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-chartingxwithxspreadsheets)" transform="translate(0, 8)"><rect x="60" y="60" width="220" height="240" fill="#151b24" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="80" y1="90" x2="260" y2="90" stroke="rgba(59,130,246,0.28)"/>
  <line x1="80" y1="120" x2="260" y2="120" stroke="rgba(59,130,246,0.28)"/>
  <line x1="80" y1="150" x2="260" y2="150" stroke="rgba(59,130,246,0.28)"/>
  <text x="70" y="85" fill="#94a3b8" font-size="10" font-family="monospace">timestamp</text>
  <rect x="320" y="80" width="260" height="200" fill="#151b24" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <polyline points="340,240 400,180 460,200 520,120 560,140" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="400" y="70" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui">Line chart</text></g>
</svg>