<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-charting-with-spreadsheets desc-charting-with-spreadsheets">
  <title id="title-charting-with-spreadsheets">Spreadsheet charting</title>
  <desc id="desc-charting-with-spreadsheets">CSV columns drive a line chart</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="60" y="60" width="220" height="240" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <line x1="80" y1="90" x2="260" y2="90" stroke="#c4d6b0"/>
  <line x1="80" y1="120" x2="260" y2="120" stroke="#c4d6b0"/>
  <line x1="80" y1="150" x2="260" y2="150" stroke="#c4d6b0"/>
  <text x="70" y="85" fill="#381d2a" font-size="10" font-family="monospace">timestamp</text>
  <rect x="320" y="80" width="260" height="200" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <polyline points="340,240 400,180 460,200 520,120 560,140" fill="none" stroke="#ba5624" stroke-width="3"/>
  <text x="400" y="70" text-anchor="middle" fill="#381d2a" font-size="13" font-family="system-ui">Line chart</text>
</svg>