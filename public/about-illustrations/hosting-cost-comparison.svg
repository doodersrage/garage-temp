<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-hosting-cost-comparison desc-hosting-cost-comparison">
  <title id="title-hosting-cost-comparison">Hosting cost comparison</title>
  <desc id="desc-hosting-cost-comparison">Relative monthly cost bars by stack</desc>
  <defs>
    <linearGradient id="bg-hostingxcostxcomparison" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-hostingxcostxcomparison" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-hostingxcostxcomparison" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-hostingxcostxcomparison" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-hostingxcostxcomparison" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-hostingxcostxcomparison)"/>
  <rect width="640" height="360" fill="url(#glow-hostingxcostxcomparison)"/>
  <rect width="640" height="360" fill="url(#glow2-hostingxcostxcomparison)"/>
  <rect width="640" height="360" fill="url(#dots-hostingxcostxcomparison)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">HOSTING COST COMPARISON</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-hostingxcostxcomparison)" transform="translate(0, 8)"><text x="80" y="70" fill="#94a3b8" font-size="12" font-family="system-ui">Edge Astro</text>
  <rect x="200" y="50" width="80" height="30" fill="rgba(59,130,246,0.28)"/>
  <text x="80" y="120" fill="#94a3b8" font-size="12" font-family="system-ui">VPS Node</text>
  <rect x="200" y="100" width="200" height="30" fill="#60a5fa"/>
  <text x="80" y="170" fill="#94a3b8" font-size="12" font-family="system-ui">Vercel Next</text>
  <rect x="200" y="150" width="160" height="30" fill="#3b82f6"/>
  <text x="80" y="220" fill="#94a3b8" font-size="12" font-family="system-ui">Home relay</text>
  <rect x="200" y="200" width="60" height="30" fill="#1a2230"/>
  <text x="320" y="280" fill="#94a3b8" font-size="11" font-family="system-ui">Relative monthly cost →</text></g>
</svg>