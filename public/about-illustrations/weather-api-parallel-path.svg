<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-weather-api-parallel-path desc-weather-api-parallel-path">
  <title id="title-weather-api-parallel-path">Parallel weather fetch</title>
  <desc id="desc-weather-api-parallel-path">SSR fetches probes and weather concurrently</desc>
  <defs>
    <linearGradient id="bg-weatherxapixparallelxpath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-weatherxapixparallelxpath" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-weatherxapixparallelxpath" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-weatherxapixparallelxpath" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-weatherxapixparallelxpath" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-weatherxapixparallelxpath)"/>
  <rect width="640" height="360" fill="url(#glow-weatherxapixparallelxpath)"/>
  <rect width="640" height="360" fill="url(#glow2-weatherxapixparallelxpath)"/>
  <rect width="640" height="360" fill="url(#dots-weatherxapixparallelxpath)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">PARALLEL WEATHER FETCH</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-weatherxapixparallelxpath)" transform="translate(0, 8)"><rect x="260" y="100" width="120" height="60" rx="6" fill="#1a2230"/>
  <text x="320" y="135" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="system-ui">Astro SSR</text>
  <rect x="80" y="220" width="140" height="60" rx="4" fill="#3b82f6"/>
  <text x="150" y="255" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui">Probe JSON</text>
  <rect x="420" y="220" width="140" height="60" rx="4" fill="rgba(59,130,246,0.28)"/>
  <text x="490" y="255" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">Weather API</text>
  <line x1="290" y1="160" x2="150" y2="220" stroke="#60a5fa" stroke-width="2"/>
  <line x1="350" y1="160" x2="490" y2="220" stroke="#60a5fa" stroke-width="2"/>
  <text x="280" y="310" fill="#94a3b8" font-size="12" font-family="system-ui">Promise.allSettled</text></g>
</svg>