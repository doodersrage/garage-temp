<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-probe-cable-length-limits desc-probe-cable-length-limits">
  <title id="title-probe-cable-length-limits">Probe cable length</title>
  <desc id="desc-probe-cable-length-limits">Short clean run versus long noisy cable</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="60" y="160" width="80" height="50" rx="4" fill="#381d2a"/>
  <text x="100" y="190" text-anchor="middle" fill="#fcde9c" font-size="11" font-family="system-ui">Arduino</text>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#c4d6b0" stroke-width="4"/>
  <rect x="220" y="170" width="40" height="30" rx="15" fill="#ba5624"/>
  <text x="100" y="140" fill="#381d2a" font-size="12" font-family="system-ui">Short OK</text>
  <rect x="340" y="160" width="80" height="50" rx="4" fill="#381d2a"/>
  <path d="M420 185 H520" stroke="#ffa552" stroke-width="4" stroke-dasharray="8 4"/>
  <text x="470" y="170" fill="#ba5624" font-size="20" font-family="system-ui">⚡</text>
  <rect x="520" y="170" width="40" height="30" rx="15" fill="#ba5624"/>
  <text x="470" y="140" fill="#381d2a" font-size="12" font-family="system-ui">Long + noise</text>
</svg>