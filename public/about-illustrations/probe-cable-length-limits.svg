<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-probe-cable-length-limits desc-probe-cable-length-limits">
  <title id="title-probe-cable-length-limits">Probe cable length</title>
  <desc id="desc-probe-cable-length-limits">Short clean run versus long noisy cable</desc>
  <defs>
    <linearGradient id="bg-probexcablexlengthxlimits" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-probexcablexlengthxlimits" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-probexcablexlengthxlimits" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-probexcablexlengthxlimits" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-probexcablexlengthxlimits" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-probexcablexlengthxlimits)"/>
  <rect width="640" height="360" fill="url(#glow-probexcablexlengthxlimits)"/>
  <rect width="640" height="360" fill="url(#glow2-probexcablexlengthxlimits)"/>
  <rect width="640" height="360" fill="url(#dots-probexcablexlengthxlimits)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">PROBE CABLE LENGTH</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-probexcablexlengthxlimits)" transform="translate(0, 8)"><rect x="60" y="160" width="80" height="50" rx="4" fill="#1a2230"/>
  <text x="100" y="190" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="system-ui">Arduino</text>
  <line x1="140" y1="185" x2="220" y2="185" stroke="rgba(59,130,246,0.28)" stroke-width="4"/>
  <rect x="220" y="170" width="40" height="30" rx="15" fill="#3b82f6"/>
  <text x="100" y="140" fill="#94a3b8" font-size="12" font-family="system-ui">Short OK</text>
  <rect x="340" y="160" width="80" height="50" rx="4" fill="#1a2230"/>
  <path d="M420 185 H520" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 4"/>
  <text x="470" y="170" fill="#3b82f6" font-size="20" font-family="system-ui">⚡</text>
  <rect x="520" y="170" width="40" height="30" rx="15" fill="#3b82f6"/>
  <text x="470" y="140" fill="#94a3b8" font-size="12" font-family="system-ui">Long + noise</text></g>
</svg>