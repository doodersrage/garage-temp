<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-serial-debugging-tips desc-serial-debugging-tips">
  <title id="title-serial-debugging-tips">Serial debugging</title>
  <desc id="desc-serial-debugging-tips">Laptop serial monitor connected to Arduino</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="80" y="120" width="100" height="70" rx="4" fill="#381d2a"/>
  <text x="130" y="160" text-anchor="middle" fill="#fcde9c" font-size="11" font-family="system-ui">Uno</text>
  <rect x="280" y="80" width="280" height="200" rx="6" fill="#ffffff" stroke="#381d2a" stroke-width="2"/>
  <text x="300" y="110" fill="#381d2a" font-size="11" font-family="monospace">DHT OK p0</text>
  <text x="300" y="135" fill="#381d2a" font-size="11" font-family="monospace">IP 192.168.1.50</text>
  <text x="300" y="160" fill="#ba5624" font-size="11" font-family="monospace">HTTP 200</text>
  <line x1="180" y1="155" x2="280" y2="155" stroke="#c4d6b0" stroke-width="3"/>
  <text x="420" y="250" fill="#381d2a" font-size="12" font-family="system-ui">Serial monitor</text>
</svg>