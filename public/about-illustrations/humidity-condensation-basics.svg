<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-humidity-condensation-basics desc-humidity-condensation-basics">
  <title id="title-humidity-condensation-basics">Humidity and condensation</title>
  <desc id="desc-humidity-condensation-basics">Warm humid air meets a cold slab and releases moisture</desc>
  <defs>
    <linearGradient id="bg-humidityxcondensationxbasics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-humidityxcondensationxbasics" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-humidityxcondensationxbasics" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-humidityxcondensationxbasics" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-humidityxcondensationxbasics" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-humidityxcondensationxbasics)"/>
  <rect width="640" height="360" fill="url(#glow-humidityxcondensationxbasics)"/>
  <rect width="640" height="360" fill="url(#glow2-humidityxcondensationxbasics)"/>
  <rect width="640" height="360" fill="url(#dots-humidityxcondensationxbasics)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">HUMIDITY AND CONDENSATION</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-humidityxcondensationxbasics)" transform="translate(0, 8)"><rect x="40" y="240" width="560" height="80" fill="#1a2230" opacity="0.85"/>
  <text x="320" y="285" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="14">Cold concrete slab</text>
  <path d="M120 80 Q200 140 280 200 T440 220" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <ellipse cx="180" cy="100" rx="70" ry="40" fill="rgba(59,130,246,0.28)" opacity="0.7"/>
  <text x="180" y="105" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui">Humid air</text>
  <circle cx="400" cy="180" r="8" fill="#60a5fa"/>
  <circle cx="420" cy="200" r="6" fill="#60a5fa"/>
  <circle cx="380" cy="210" r="7" fill="#60a5fa"/>
  <text x="480" y="170" fill="#94a3b8" font-size="12" font-family="system-ui">Dew point</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker></defs></g>
</svg>