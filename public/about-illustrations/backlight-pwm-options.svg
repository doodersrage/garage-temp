<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-backlight-pwm-options desc-backlight-pwm-options">
  <title id="title-backlight-pwm-options">LCD backlight PWM</title>
  <desc id="desc-backlight-pwm-options">Transistor switches backlight LED</desc>
  <defs>
    <linearGradient id="bg-backlightxpwmxoptions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-backlightxpwmxoptions" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-backlightxpwmxoptions" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-backlightxpwmxoptions" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-backlightxpwmxoptions" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-backlightxpwmxoptions)"/>
  <rect width="640" height="360" fill="url(#glow-backlightxpwmxoptions)"/>
  <rect width="640" height="360" fill="url(#glow2-backlightxpwmxoptions)"/>
  <rect width="640" height="360" fill="url(#dots-backlightxpwmxoptions)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">LCD BACKLIGHT PWM</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-backlightxpwmxoptions)" transform="translate(0, 8)"><rect x="100" y="100" width="200" height="120" rx="4" fill="#1a2230"/>
  <text x="200" y="170" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="system-ui">LCD</text>
  <rect x="380" y="140" width="60" height="40" fill="#3b82f6"/>
  <text x="410" y="165" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui">NPN</text>
  <circle cx="520" cy="160" r="30" fill="#60a5fa"/>
  <text x="520" y="165" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">LED</text>
  <line x1="300" y1="160" x2="380" y2="160" stroke="rgba(59,130,246,0.28)" stroke-width="2"/>
  <text x="60" y="160" fill="#94a3b8" font-size="11" font-family="system-ui">PWM pin</text></g>
</svg>