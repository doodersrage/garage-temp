<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="esp32-wiring-title esp32-wiring-desc">
  <title id="esp32-wiring-title">ESP32 to waterproof DS18B20 wiring</title>
  <desc id="esp32-wiring-desc">
    USB power to ESP32 DevKit. DS18B20 red to 3.3V, black to GND, yellow data to GPIO 4.
    A 4.7 kilohm resistor pulls the data line up to 3.3V.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898785" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#f7f6f2"/>

  <!-- USB -->
  <rect x="24" y="28" width="100" height="40" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="74" y="52" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="13" font-weight="500" font-family="system-ui, sans-serif">USB 5 V</text>
  <line x1="124" y1="48" x2="168" y2="48" stroke="#898785" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- ESP32 -->
  <rect x="170" y="16" width="200" height="100" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="270" y="42" text-anchor="middle" dominant-baseline="central" fill="#0c447c" font-size="15" font-weight="600" font-family="system-ui, sans-serif">ESP32 DevKit</text>
  <text x="270" y="64" text-anchor="middle" dominant-baseline="central" fill="#185fa5" font-size="12" font-family="system-ui, sans-serif">Wi-Fi / HTTPS ingest</text>
  <text x="210" y="92" text-anchor="middle" fill="#c44c2a" font-size="11" font-weight="600" font-family="system-ui, sans-serif">3V3</text>
  <text x="270" y="92" text-anchor="middle" fill="#5f5e5a" font-size="11" font-weight="600" font-family="system-ui, sans-serif">GND</text>
  <text x="330" y="92" text-anchor="middle" fill="#185fa5" font-size="11" font-weight="600" font-family="system-ui, sans-serif">GPIO 4</text>

  <!-- Vertical rails from ESP32 pins -->
  <line x1="210" y1="116" x2="210" y2="280" stroke="#c44c2a" stroke-width="2"/>
  <line x1="270" y1="116" x2="270" y2="280" stroke="#5f5e5a" stroke-width="2"/>
  <line x1="330" y1="116" x2="330" y2="280" stroke="#185fa5" stroke-width="2"/>

  <!-- Pull-up resistor between 3V3 rail and data (GPIO4) rail -->
  <!-- horizontal from 3V3 rail -->
  <line x1="210" y1="160" x2="248" y2="160" stroke="#0f6e56" stroke-width="1.5"/>
  <!-- zigzag resistor -->
  <path d="M248,160 L256,148 L264,172 L272,148 L280,172 L288,148 L296,160" fill="none" stroke="#0f6e56" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- horizontal to data rail -->
  <line x1="296" y1="160" x2="330" y2="160" stroke="#0f6e56" stroke-width="1.5"/>

  <rect x="236" y="118" width="72" height="22" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="272" y="130" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="11" font-weight="600" font-family="system-ui, sans-serif">4.7 kOhm</text>
  <text x="272" y="186" text-anchor="middle" fill="#0f6e56" font-size="11" font-family="system-ui, sans-serif">pull-up: data to 3.3 V</text>

  <!-- Wire labels -->
  <text x="198" y="240" text-anchor="end" fill="#c44c2a" font-size="11" font-family="system-ui, sans-serif">red</text>
  <text x="282" y="240" fill="#5f5e5a" font-size="11" font-family="system-ui, sans-serif">black</text>
  <text x="342" y="240" fill="#185fa5" font-size="11" font-family="system-ui, sans-serif">yellow / white</text>

  <!-- DS18B20 -->
  <rect x="170" y="280" width="200" height="96" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="270" y="308" text-anchor="middle" dominant-baseline="central" fill="#712b13" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Waterproof DS18B20</text>
  <text x="270" y="332" text-anchor="middle" dominant-baseline="central" fill="#993c1d" font-size="12" font-family="system-ui, sans-serif">VCC / GND / DATA</text>
  <text x="270" y="354" text-anchor="middle" dominant-baseline="central" fill="#993c1d" font-size="11" font-family="system-ui, sans-serif">sample sketch uses GPIO 4</text>

  <!-- Legend -->
  <rect x="420" y="40" width="236" height="220" rx="8" fill="#fff" stroke="#d3d1c7" stroke-width="0.5"/>
  <text x="438" y="68" fill="#444441" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Connections</text>
  <text x="438" y="96" fill="#c44c2a" font-size="12" font-family="system-ui, sans-serif">Red (VCC)  -&gt; ESP32 3.3 V</text>
  <text x="438" y="120" fill="#5f5e5a" font-size="12" font-family="system-ui, sans-serif">Black (GND) -&gt; GND</text>
  <text x="438" y="144" fill="#185fa5" font-size="12" font-family="system-ui, sans-serif">Yellow (data) -&gt; GPIO 4</text>
  <text x="438" y="176" fill="#0f6e56" font-size="12" font-family="system-ui, sans-serif">4.7 kOhm between</text>
  <text x="438" y="196" fill="#0f6e56" font-size="12" font-family="system-ui, sans-serif">data line and 3.3 V</text>
  <text x="438" y="228" fill="#898785" font-size="11" font-family="system-ui, sans-serif">(omit if probe pack includes it)</text>
</svg>
