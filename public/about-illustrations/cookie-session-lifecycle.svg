<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-cookie-session-lifecycle desc-cookie-session-lifecycle">
  <title id="title-cookie-session-lifecycle">Session cookie lifecycle</title>
  <desc id="desc-cookie-session-lifecycle">Sign-in to cookie to SSR to history insert</desc>
  <defs>
    <linearGradient id="bg-cookiexsessionxlifecycle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-cookiexsessionxlifecycle" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-cookiexsessionxlifecycle" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-cookiexsessionxlifecycle" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-cookiexsessionxlifecycle" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-cookiexsessionxlifecycle)"/>
  <rect width="640" height="360" fill="url(#glow-cookiexsessionxlifecycle)"/>
  <rect width="640" height="360" fill="url(#glow2-cookiexsessionxlifecycle)"/>
  <rect width="640" height="360" fill="url(#dots-cookiexsessionxlifecycle)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">SESSION COOKIE LIFECYCLE</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-cookiexsessionxlifecycle)" transform="translate(0, 8)"><rect x="60" y="160" width="90" height="50" rx="4" fill="#60a5fa"/>
  <text x="105" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">Sign-in</text>
  <rect x="190" y="160" width="90" height="50" rx="4" fill="rgba(59,130,246,0.28)"/>
  <text x="235" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">Cookie</text>
  <rect x="320" y="160" width="90" height="50" rx="4" fill="#1a2230"/>
  <text x="365" y="190" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui">SSR</text>
  <rect x="450" y="160" width="130" height="50" rx="4" fill="#3b82f6"/>
  <text x="515" y="190" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui">History insert</text>
  <line x1="150" y1="185" x2="190" y2="185" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="280" y1="185" x2="320" y2="185" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="410" y1="185" x2="450" y2="185" stroke="rgba(255,255,255,0.18)" stroke-width="2"/></g>
</svg>