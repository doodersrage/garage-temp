<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-ground-loop-avoidance desc-ground-loop-avoidance">
  <title id="title-ground-loop-avoidance">Ground star wiring</title>
  <desc id="desc-ground-loop-avoidance">Single ground reference at Arduino</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <circle cx="320" cy="200" r="40" fill="#381d2a"/>
  <text x="320" y="205" text-anchor="middle" fill="#fcde9c" font-size="11" font-family="system-ui">GND ★</text>
  <line x1="320" y1="200" x2="120" y2="100" stroke="#c4d6b0" stroke-width="3"/>
  <line x1="320" y1="200" x2="520" y2="100" stroke="#c4d6b0" stroke-width="3"/>
  <line x1="320" y1="200" x2="120" y2="300" stroke="#c4d6b0" stroke-width="3"/>
  <line x1="320" y1="200" x2="520" y2="300" stroke="#c4d6b0" stroke-width="3"/>
  <text x="320" y="60" text-anchor="middle" fill="#381d2a" font-size="13" font-family="system-ui">Star ground (good)</text>
  <path d="M80 320 H200 H120 H240" stroke="#ba5624" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  <text x="160" y="345" fill="#ba5624" font-size="11" font-family="system-ui">Loop (bad)</text>
</svg>