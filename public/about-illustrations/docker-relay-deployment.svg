<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-docker-relay-deployment desc-docker-relay-deployment">
  <title id="title-docker-relay-deployment">Docker relay stack</title>
  <desc id="desc-docker-relay-deployment">Compose services for relay Redis and proxy</desc>
  <defs>
