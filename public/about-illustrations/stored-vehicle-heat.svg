  <text x="220" y="250" text-anchor="middle" fill="#fcde9c" font-size="12" font-family="system-ui">Vehicle</text>
  <path d="M220 160 Q220 100 280 80 Q340 60 380 90" stroke="#ffa552" stroke-width="2" fill="none" opacity="0.6"/>
