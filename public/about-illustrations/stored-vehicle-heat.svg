<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-stored-vehicle-heat desc-stored-vehicle-heat">
  <title id="title-stored-vehicle-heat">Vehicle heat plume</title>
  <desc id="desc-stored-vehicle-heat">Parked car radiates heat toward nearby probe</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="120" y="200" width="200" height="80" rx="12" fill="#381d2a"/>
