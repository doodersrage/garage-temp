<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-sensor-warm-up-time desc-sensor-warm-up-time">
  <title id="title-sensor-warm-up-time">Sensor warm-up</title>
  <desc id="desc-sensor-warm-up-time">Humidity settles after power-on</desc>
  <defs>
    <linearGradient id="bg-sensorxwarmxupxtime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-sensorxwarmxupxtime" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-sensorxwarmxupxtime" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-sensorxwarmxupxtime" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-sensorxwarmxupxtime" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-sensorxwarmxupxtime)"/>
  <rect width="640" height="360" fill="url(#glow-sensorxwarmxupxtime)"/>
  <rect width="640" height="360" fill="url(#glow2-sensorxwarmxupxtime)"/>
  <rect width="640" height="360" fill="url(#dots-sensorxwarmxupxtime)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">SENSOR WARM-UP</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-sensorxwarmxupxtime)" transform="translate(0, 8)"><line x1="60" y1="280" x2="580" y2="280" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <path d="M60 200 L120 195 L180 190 L240 188" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <text x="70" y="190" fill="#94a3b8" font-size="11" font-family="system-ui">Temp</text>
  <path d="M60 240 Q180 230 280 200 T560 170" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <text x="70" y="250" fill="#94a3b8" font-size="11" font-family="system-ui">RH</text>
  <line x1="120" y1="60" x2="120" y2="280" stroke="rgba(59,130,246,0.28)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="125" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">Power on</text></g>
</svg>