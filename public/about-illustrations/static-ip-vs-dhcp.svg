<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-static-ip-vs-dhcp desc-static-ip-vs-dhcp">
  <title id="title-static-ip-vs-dhcp">Static IP vs DHCP</title>
  <desc id="desc-static-ip-vs-dhcp">Router assigns stable IP to Arduino MAC</desc>
  <defs>
    <linearGradient id="bg-staticxipxvsxdhcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-staticxipxvsxdhcp" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-staticxipxvsxdhcp" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-staticxipxvsxdhcp" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-staticxipxvsxdhcp" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-staticxipxvsxdhcp)"/>
  <rect width="640" height="360" fill="url(#glow-staticxipxvsxdhcp)"/>
  <rect width="640" height="360" fill="url(#glow2-staticxipxvsxdhcp)"/>
  <rect width="640" height="360" fill="url(#dots-staticxipxvsxdhcp)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">STATIC IP VS DHCP</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-staticxipxvsxdhcp)" transform="translate(0, 8)"><rect x="260" y="100" width="120" height="80" rx="6" fill="#1a2230"/>
  <text x="320" y="145" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="system-ui">Router</text>
  <rect x="80" y="220" width="100" height="60" rx="4" fill="#3b82f6"/>
  <text x="130" y="255" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="system-ui">Arduino</text>
  <text x="130" y="200" fill="#94a3b8" font-size="10" font-family="monospace">MAC → .50</text>
  <rect x="460" y="220" width="100" height="60" rx="4" fill="#60a5fa" opacity="0.8"/>
  <text x="510" y="250" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">DHCP pool</text>
  <line x1="180" y1="250" x2="260" y2="160" stroke="rgba(59,130,246,0.28)" stroke-width="2"/>
  <line x1="440" y1="250" x2="380" y2="160" stroke="rgba(59,130,246,0.28)" stroke-width="2" stroke-dasharray="6 3"/></g>
</svg>