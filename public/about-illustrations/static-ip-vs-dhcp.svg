<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-static-ip-vs-dhcp desc-static-ip-vs-dhcp">
  <title id="title-static-ip-vs-dhcp">Static IP vs DHCP</title>
  <desc id="desc-static-ip-vs-dhcp">Router assigns stable IP to Arduino MAC</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="260" y="100" width="120" height="80" rx="6" fill="#381d2a"/>
  <text x="320" y="145" text-anchor="middle" fill="#fcde9c" font-size="12" font-family="system-ui">Router</text>
  <rect x="80" y="220" width="100" height="60" rx="4" fill="#ba5624"/>
  <text x="130" y="255" text-anchor="middle" fill="#fcde9c" font-size="10" font-family="system-ui">Arduino</text>
  <text x="130" y="200" fill="#381d2a" font-size="10" font-family="monospace">MAC → .50</text>
  <rect x="460" y="220" width="100" height="60" rx="4" fill="#ffa552" opacity="0.8"/>
  <text x="510" y="250" text-anchor="middle" fill="#381d2a" font-size="10" font-family="system-ui">DHCP pool</text>
  <line x1="180" y1="250" x2="260" y2="160" stroke="#c4d6b0" stroke-width="2"/>
  <line x1="440" y1="250" x2="380" y2="160" stroke="#c4d6b0" stroke-width="2" stroke-dasharray="6 3"/>
</svg>