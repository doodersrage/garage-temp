<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-jumper-wire-standards desc-jumper-wire-standards">
  <title id="title-jumper-wire-standards">Jumper wire colors</title>
  <desc id="desc-jumper-wire-standards">Color-coded breadboard jumpers</desc>
  <defs>
    <linearGradient id="bg-jumperxwirexstandards" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-jumperxwirexstandards" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-jumperxwirexstandards" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-jumperxwirexstandards" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-jumperxwirexstandards" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-jumperxwirexstandards)"/>
  <rect width="640" height="360" fill="url(#glow-jumperxwirexstandards)"/>
  <rect width="640" height="360" fill="url(#glow2-jumperxwirexstandards)"/>
  <rect width="640" height="360" fill="url(#dots-jumperxwirexstandards)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">JUMPER WIRE COLORS</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-jumperxwirexstandards)" transform="translate(0, 8)"><rect x="200" y="80" width="240" height="200" fill="#151b24" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="240" y1="120" x2="400" y2="120" stroke="#cc0000" stroke-width="4"/>
  <text x="420" y="125" fill="#94a3b8" font-size="11" font-family="system-ui">5V red</text>
  <line x1="240" y1="160" x2="400" y2="160" stroke="#222" stroke-width="4"/>
  <text x="420" y="165" fill="#94a3b8" font-size="11" font-family="system-ui">GND black</text>
  <line x1="240" y1="200" x2="400" y2="200" stroke="rgba(59,130,246,0.28)" stroke-width="4"/>
  <text x="420" y="205" fill="#94a3b8" font-size="11" font-family="system-ui">Data</text>
  <line x1="240" y1="240" x2="400" y2="240" stroke="#60a5fa" stroke-width="4"/>
  <text x="420" y="245" fill="#94a3b8" font-size="11" font-family="system-ui">Data 2</text></g>
</svg>