<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-spotting-data-gaps desc-spotting-data-gaps">
  <title id="title-spotting-data-gaps">Data gaps in charts</title>
  <desc id="desc-spotting-data-gaps">Gap versus flat line in time series</desc>
  <defs>
    <linearGradient id="bg-spottingxdataxgaps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-spottingxdataxgaps" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-spottingxdataxgaps" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-spottingxdataxgaps" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-spottingxdataxgaps" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-spottingxdataxgaps)"/>
  <rect width="640" height="360" fill="url(#glow-spottingxdataxgaps)"/>
  <rect width="640" height="360" fill="url(#glow2-spottingxdataxgaps)"/>
  <rect width="640" height="360" fill="url(#dots-spottingxdataxgaps)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">DATA GAPS IN CHARTS</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-spottingxdataxgaps)" transform="translate(0, 8)"><line x1="60" y1="280" x2="580" y2="280" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <polyline points="60,220 140,200 220,210 300,190" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="340" y="200" fill="#94a3b8" font-size="24" font-family="system-ui">···</text>
  <polyline points="420,180 500,170 580,160" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="60" y1="100" x2="580" y2="100" stroke="rgba(59,130,246,0.28)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="70" y="90" fill="#94a3b8" font-size="12" font-family="system-ui">Flat (valid)</text>
  <text x="330" y="240" fill="#3b82f6" font-size="12" font-family="system-ui">Gap (missing)</text></g>
</svg>