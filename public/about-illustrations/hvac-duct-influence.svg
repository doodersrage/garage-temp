<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-hvac-duct-influence desc-hvac-duct-influence">
  <title id="title-hvac-duct-influence">HVAC duct influence</title>
  <desc id="desc-hvac-duct-influence">Duct leak warms air near a probe</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="0" y="0" width="640" height="200" fill="#c4d6b0" opacity="0.35"/>
  <rect x="200" y="40" width="240" height="40" rx="20" fill="#381d2a"/>
  <text x="320" y="65" text-anchor="middle" fill="#fcde9c" font-size="12" font-family="system-ui">HVAC duct</text>
  <path d="M280 80 Q300 120 320 160" stroke="#ffa552" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
  <circle cx="320" cy="200" r="24" fill="#ba5624"/>
  <text x="320" y="205" text-anchor="middle" fill="#fcde9c" font-size="11" font-family="system-ui">Probe</text>
  <text x="400" y="130" fill="#381d2a" font-size="12" font-family="system-ui">Warm leak</text>
</svg>