<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-hvac-duct-influence desc-hvac-duct-influence">
  <title id="title-hvac-duct-influence">HVAC duct influence</title>
  <desc id="desc-hvac-duct-influence">Duct leak warms air near a probe</desc>
  <defs>
    <linearGradient id="bg-hvacxductxinfluence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-hvacxductxinfluence" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-hvacxductxinfluence" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-hvacxductxinfluence" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-hvacxductxinfluence" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-hvacxductxinfluence)"/>
  <rect width="640" height="360" fill="url(#glow-hvacxductxinfluence)"/>
  <rect width="640" height="360" fill="url(#glow2-hvacxductxinfluence)"/>
  <rect width="640" height="360" fill="url(#dots-hvacxductxinfluence)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">HVAC DUCT INFLUENCE</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-hvacxductxinfluence)" transform="translate(0, 8)"><rect x="0" y="0" width="640" height="200" fill="rgba(59,130,246,0.28)" opacity="0.35"/>
  <rect x="200" y="40" width="240" height="40" rx="20" fill="#1a2230"/>
  <text x="320" y="65" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="system-ui">HVAC duct</text>
  <path d="M280 80 Q300 120 320 160" stroke="#60a5fa" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
  <circle cx="320" cy="200" r="24" fill="#3b82f6"/>
  <text x="320" y="205" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="system-ui">Probe</text>
  <text x="400" y="130" fill="#94a3b8" font-size="12" font-family="system-ui">Warm leak</text></g>
</svg>