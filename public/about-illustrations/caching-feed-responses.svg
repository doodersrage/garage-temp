<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-caching-feed-responses desc-caching-feed-responses">
  <title id="title-caching-feed-responses">Feed caching layers</title>
  <desc id="desc-caching-feed-responses">Cache stack from browser to Arduino</desc>
  <defs>
    <linearGradient id="bg-cachingxfeedxresponses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-cachingxfeedxresponses" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-cachingxfeedxresponses" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-cachingxfeedxresponses" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-cachingxfeedxresponses" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-cachingxfeedxresponses)"/>
  <rect width="640" height="360" fill="url(#glow-cachingxfeedxresponses)"/>
  <rect width="640" height="360" fill="url(#glow2-cachingxfeedxresponses)"/>
  <rect width="640" height="360" fill="url(#dots-cachingxfeedxresponses)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">FEED CACHING LAYERS</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-cachingxfeedxresponses)" transform="translate(0, 8)"><rect x="40" y="150" width="90" height="50" rx="4" fill="#60a5fa"/>
  <text x="85" y="180" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Browser</text>
  <rect x="160" y="150" width="90" height="50" rx="4" fill="rgba(59,130,246,0.28)"/>
  <text x="205" y="180" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Edge</text>
  <rect x="280" y="150" width="90" height="50" rx="4" fill="#1a2230"/>
  <text x="325" y="180" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="system-ui">Redis</text>
  <rect x="400" y="150" width="90" height="50" rx="4" fill="#3b82f6"/>
  <text x="445" y="180" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="system-ui">Relay</text>
  <rect x="520" y="150" width="90" height="50" rx="4" fill="#60a5fa"/>
  <text x="565" y="180" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Arduino</text>
  <line x1="130" y1="175" x2="160" y2="175" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="250" y1="175" x2="280" y2="175" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="370" y1="175" x2="400" y2="175" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="490" y1="175" x2="520" y2="175" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <text x="320" y="120" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui">TTL decreases →</text></g>
</svg>