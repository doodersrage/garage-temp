  <line x1="370" y1="175" x2="400" y2="175" stroke="#381d2a" stroke-width="2"/>
  <line x1="490" y1="175" x2="520" y2="175" stroke="#381d2a" stroke-width="2"/>
  <text x="320" y="120" text-anchor="middle" fill="#381d2a" font-size="12" font-family="system-ui">TTL decreases →</text>
