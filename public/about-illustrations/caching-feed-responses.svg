<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-caching-feed-responses desc-caching-feed-responses">
  <title id="title-caching-feed-responses">Feed caching layers</title>
  <desc id="desc-caching-feed-responses">Cache stack from browser to Arduino</desc>
  <rect width="640" height="360" fill="#fcde9c" rx="8"/>
  <rect x="40" y="150" width="90" height="50" rx="4" fill="#ffa552"/>
  <text x="85" y="180" text-anchor="middle" fill="#381d2a" font-size="9" font-family="system-ui">Browser</text>
  <rect x="160" y="150" width="90" height="50" rx="4" fill="#c4d6b0"/>
  <text x="205" y="180" text-anchor="middle" fill="#381d2a" font-size="9" font-family="system-ui">Edge</text>
  <rect x="280" y="150" width="90" height="50" rx="4" fill="#381d2a"/>
  <text x="325" y="180" text-anchor="middle" fill="#fcde9c" font-size="9" font-family="system-ui">Redis</text>
  <rect x="400" y="150" width="90" height="50" rx="4" fill="#ba5624"/>
