<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-tailwind-v4-setup desc-tailwind-v4-setup">
  <title id="title-tailwind-v4-setup">Tailwind v4 in Astro</title>
  <desc id="desc-tailwind-v4-setup">CSS theme tokens flow to components</desc>
  <defs>
    <linearGradient id="bg-tailwindxv4xsetup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="45%" stop-color="#090b0f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glow-tailwindxv4xsetup" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <radialGradient id="glow2-tailwindxv4xsetup" cx="12%" cy="92%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.14)"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
    </radialGradient>
    <pattern id="dots-tailwindxv4xsetup" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)"/>
    </pattern>
    <filter id="soft-tailwindxv4xsetup" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg-tailwindxv4xsetup)"/>
  <rect width="640" height="360" fill="url(#glow-tailwindxv4xsetup)"/>
  <rect width="640" height="360" fill="url(#glow2-tailwindxv4xsetup)"/>
  <rect width="640" height="360" fill="url(#dots-tailwindxv4xsetup)" opacity="0.55"/>
  <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <rect x="17" y="17" width="606" height="326" rx="13" fill="rgba(255,255,255,0.02)"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em">TAILWIND V4 IN ASTRO</text>
  <line x1="36" y1="52" x2="604" y2="52" stroke="rgba(255,255,255,0.06)"/>
  <g filter="url(#soft-tailwindxv4xsetup)" transform="translate(0, 8)"><rect x="100" y="80" width="180" height="100" rx="6" fill="#1a2230"/>
  <text x="190" y="130" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="system-ui">@theme CSS</text>
  <rect x="360" y="60" width="180" height="70" rx="4" fill="rgba(59,130,246,0.28)"/>
  <text x="450" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui">Astro layout</text>
  <rect x="360" y="150" width="180" height="70" rx="4" fill="#60a5fa"/>
  <text x="450" y="190" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui">Components</text>
  <rect x="360" y="240" width="180" height="70" rx="4" fill="#3b82f6"/>
  <text x="450" y="280" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="system-ui">Islands</text>
  <line x1="280" y1="130" x2="360" y2="95" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="280" y1="130" x2="360" y2="185" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <line x1="280" y1="130" x2="360" y2="275" stroke="rgba(255,255,255,0.18)" stroke-width="2"/></g>
</svg>