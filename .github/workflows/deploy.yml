name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production builds must use real secrets (Astro inlines import.meta.env at build time).
# CI placeholders here would ship a broken Worker. Values come from repo secrets
# synced via: CLOUDFLARE_API_TOKEN=... pnpm setup:github-secrets
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SITE_URL: ${{ secrets.SITE_URL }}
  ORIGIN: ${{ secrets.ORIGIN }}
  GARAGE_TEMP_FEED_URL: ${{ secrets.GARAGE_TEMP_FEED_URL }}
  NEXT_PUBLIC_OPENWEATHER_API_KEY: ${{ secrets.NEXT_PUBLIC_OPENWEATHER_API_KEY }}
  NEXT_PUBLIC_OPENWEATHER_CITY_ID: ${{ secrets.NEXT_PUBLIC_OPENWEATHER_CITY_ID }}
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
  TURNSTILE_SECRET_TOKEN: ${{ secrets.TURNSTILE_SECRET_TOKEN }}
  SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
  SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
  STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
  STRIPE_DISPLAY_MEMBER_MONTHLY: ${{ secrets.STRIPE_DISPLAY_MEMBER_MONTHLY }}
  STRIPE_DISPLAY_MEMBER_ANNUAL: ${{ secrets.STRIPE_DISPLAY_MEMBER_ANNUAL }}
  STRIPE_DISPLAY_PRO_MONTHLY: ${{ secrets.STRIPE_DISPLAY_PRO_MONTHLY }}
  STRIPE_DISPLAY_PRO_ANNUAL: ${{ secrets.STRIPE_DISPLAY_PRO_ANNUAL }}
  STRIPE_PRICE_ID_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_ANNUAL }}
  STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PRO_ANNUAL }}
  PRICING_DEFAULT_INTERVAL: ${{ secrets.PRICING_DEFAULT_INTERVAL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
  FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require production build secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped — missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ "$SUPABASE_URL" = "https://example.supabase.co" ]; then
            echo "::notice::Deploy skipped — production SUPABASE_* GitHub secrets not synced."
            echo "Run locally: CLOUDFLARE_API_TOKEN=... pnpm setup:github-secrets"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SITE_URL" ] || [[ "$SITE_URL" != *"thermaltrace.dev"* ]]; then
            echo "::notice::Deploy skipped — SITE_URL secret must be https://thermaltrace.dev"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: env.skip != 'true'
        with:
          version: 9

      - uses: actions/setup-node@v5
        if: env.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: env.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: env.skip != 'true'
        run: pnpm test
      - if: env.skip != 'true'
        run: pnpm build || (rm -rf node_modules/.vite && pnpm build)

      - name: Deploy to Cloudflare Workers
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! npx wrangler whoami >/dev/null 2>&1; then
            echo "::notice::Deploy skipped — Cloudflare token invalid or lacks Workers permissions."
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json
