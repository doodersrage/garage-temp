name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-build-placeholder
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-build-placeholder
  SITE_URL: https://thermaltrace.dev
  ORIGIN: https://thermaltrace.dev
  GARAGE_TEMP_FEED_URL: https://example.com/feed.json
  NEXT_PUBLIC_OPENWEATHER_API_KEY: ci-placeholder
  NEXT_PUBLIC_OPENWEATHER_CITY_ID: "5128581"
  TURNSTILE_SITE_KEY: ci-placeholder
  TURNSTILE_SECRET_TOKEN: ci-placeholder
  SMTP_MAIL_FROM: ci@example.com
  SMTP_MAIL_TO: ci@example.com
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_PRICE_ID: price_ci_placeholder
  STRIPE_PRICE_ID_PRO: price_ci_placeholder_pro
  STRIPE_DISPLAY_MEMBER_MONTHLY: "1"
  STRIPE_DISPLAY_MEMBER_ANNUAL: "10"
  STRIPE_DISPLAY_PRO_MONTHLY: "5"
  STRIPE_DISPLAY_PRO_ANNUAL: "50"
  STRIPE_PRICE_ID_ANNUAL: price_ci_placeholder_annual
  STRIPE_PRICE_ID_PRO_ANNUAL: price_ci_placeholder_pro_annual
  PRICING_DEFAULT_INTERVAL: annual
  CRON_SECRET: ci-cron-secret
  VAPID_PUBLIC_KEY: ci-placeholder
  VAPID_PRIVATE_KEY: ci-placeholder
  VAPID_SUBJECT: mailto:ci@example.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build || (rm -rf node_modules/.vite && pnpm build)

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets."
            echo "Run: CLOUDFLARE_API_TOKEN=... pnpm setup:github-secrets"
            echo "Or deploy locally: pnpm deploy"
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! npx wrangler whoami >/dev/null 2>&1; then
            echo "::notice::Deploy skipped — Cloudflare token missing, invalid, or lacks Workers permissions."
            echo "Update repo secrets or deploy locally: pnpm deploy"
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json
