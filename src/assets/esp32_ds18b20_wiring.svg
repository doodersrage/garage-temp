<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ESP32 to waterproof DS18B20 wiring</title>
  <desc>
    USB-powered ESP32 DevKit with waterproof DS18B20: red to 3.3V, black to GND, yellow data to GPIO 4,
    and a 4.7 kilohm pull-up between data and 3.3V.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="120" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="100" y="66" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500" font-family="system-ui, sans-serif">USB 5 V</text>

  <rect x="200" y="28" width="220" height="88" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="310" y="58" text-anchor="middle" dominant-baseline="central" fill="#0c447c" font-size="14" font-weight="500" font-family="system-ui, sans-serif">ESP32 DevKit</text>
  <text x="310" y="82" text-anchor="middle" dominant-baseline="central" fill="#185fa5" font-size="12" font-family="system-ui, sans-serif">Wi?Fi · HTTPS ingest</text>
  <text x="310" y="100" text-anchor="middle" dominant-baseline="central" fill="#185fa5" font-size="11" font-family="system-ui, sans-serif">3V3 · GND · GPIO 4</text>

  <rect x="480" y="40" width="160" height="64" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="560" y="64" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui, sans-serif">4.7 k? pull-up</text>
  <text x="560" y="86" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-size="12" font-family="system-ui, sans-serif">Data ? 3.3 V</text>

  <rect x="200" y="220" width="280" height="88" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" fill="#712b13" font-size="14" font-weight="500" font-family="system-ui, sans-serif">Waterproof DS18B20</text>
  <text x="340" y="274" text-anchor="middle" dominant-baseline="central" fill="#993c1d" font-size="12" font-family="system-ui, sans-serif">Red ? 3.3 V · Black ? GND · Yellow ? GPIO 4</text>
  <text x="340" y="294" text-anchor="middle" dominant-baseline="central" fill="#993c1d" font-size="11" font-family="system-ui, sans-serif">ONE_WIRE_PIN 4 (sample sketch default)</text>

  <line x1="160" y1="62" x2="198" y2="62" stroke="#898785" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <line x1="420" y1="72" x2="478" y2="72" stroke="#898785" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M340,116 L340,160 L560,160 L560,106" stroke="#0f6e56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M250,116 L250,218" stroke="#c44c2a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M310,116 L310,218" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M370,116 L370,218" stroke="#185fa5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="238" y="168" fill="#c44c2a" font-size="11" font-family="system-ui, sans-serif">3V3</text>
  <text x="318" y="168" fill="#5f5e5a" font-size="11" font-family="system-ui, sans-serif">GND</text>
  <text x="378" y="168" fill="#185fa5" font-size="11" font-family="system-ui, sans-serif">GPIO4</text>
</svg>
